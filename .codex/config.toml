# mizerAgents: start - managed by setup_mizer_agent(), edits are overwritten
[mcp_servers."r-mizer"]
command = "Rscript"
args = ["-e", "local({ if (.Platform$OS.type == 'unix' && !nzchar(Sys.getenv('MCPTOOLS_SOCKET_DIR')) && !nzchar(Sys.getenv('XDG_RUNTIME_DIR'))) { uid <- file.info(path.expand('~'))$uid; runtime <- file.path('/run/user', uid); if (!is.na(uid) && dir.exists(runtime)) Sys.setenv(MCPTOOLS_SOCKET_DIR = file.path(runtime, 'mcptools')) }; btw::btw_mcp_server(btw::btw_tools('docs', 'env', 'sessioninfo', 'ide', 'run', 'pkg')) })"]
env = { BTW_RUN_R_ENABLED = "true" }

[mcp_servers."r-mizer".tools.btw_tool_pkg_test]
approval_mode = "approve"
# mizerAgents: end - add your own config above this block, not below
